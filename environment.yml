# Environment for running the notebooks (kep_light.ipynb, direct_imaging.ipynb) on Binder
# (mybinder.org reads this file automatically). It also works locally:  conda env create -f environment.yml
#
# The minimum versions are the ones the notebooks were tested with (kep_light 2026-10-02,
# direct_imaging 2026-10-05), so that Binder does not fall back to the older versions in its base image.
name: epad_obs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=2.5,<3
  - scipy>=1.18
  - pandas>=2.3
  - astropy-base>=8.0                # Box Least Squares periodogram
  - lightkurve>=2.6,<3               # reads Kepler light curves; downloads from MAST ('Other Kepler star')
  - astroquery>=0.4.11               # NASA Exoplanet Archive queries (for downloaded stars)
  - h5py>=3.16                       # direct_imaging.ipynb: reads the beta Pictoris images
  - matplotlib-base>=3.11.2,<4
  - matplotlib-inline>=0.2.2         # 0.1.6 or older shows no inline figures with IPython >= 8.24
  - ipython>=9.17.1
  - ipykernel>=7.4.0
  - ipywidgets>=8.1.9,<9
  - nbclient>=0.11.0                 # runs the notebook for the app view (Voila)
  - jupyterlab>=4.6.4,<5             # the "code" view
  - voila>=0.5.13,<0.6               # the "app" view (code hidden); see postBuild for a workaround
  - nbclassic>=1.3.3                 # supplies the MathJax 2 that Voila needs: without it, equations in the
                                     # app view stay as raw LaTeX (Voila's default MathJax 3 URL fails to load)
  - pip
  - pip:
      - batman-package>=2.5.3        # transit models; the conda-forge builds still require numpy < 2
